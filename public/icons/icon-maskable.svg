<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Versión maskable (fondo a sangre, contenido en la zona segura). Shelf Life: una repisa con un libro por tracker (juegos, pantalla, libros). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2230"/>
      <stop offset="1" stop-color="#0f1218"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="300" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5b54a" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#f5b54a" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#f5b54a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#d9902c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(51.2 51.2) scale(0.8)">
  <!-- Luz de lámpara sobre la repisa. -->
  <circle cx="256" cy="300" r="240" fill="url(#glow)"/>

  <!-- Libros (de atrás hacia adelante). El verde se apoya en el celeste. -->
  <g transform="rotate(-13 364 372)">
    <rect x="306" y="196" width="58" height="176" rx="9" fill="#5cc8b8"/>
    <rect x="306" y="224" width="58" height="7" fill="#ffffff" opacity="0.35"/>
    <rect x="306" y="336" width="58" height="7" fill="#ffffff" opacity="0.35"/>
  </g>
  <rect x="128" y="168" width="66" height="204" rx="9" fill="#da3fef"/>
  <rect x="128" y="196" width="66" height="7" fill="#ffffff" opacity="0.35"/>
  <rect x="128" y="336" width="66" height="7" fill="#ffffff" opacity="0.35"/>
  <rect x="204" y="128" width="74" height="244" rx="9" fill="#38bdf8"/>
  <rect x="204" y="158" width="74" height="7" fill="#ffffff" opacity="0.35"/>
  <rect x="204" y="336" width="74" height="7" fill="#ffffff" opacity="0.35"/>

  <!-- Repisa. -->
  <rect x="104" y="370" width="304" height="26" rx="7" fill="url(#plank)"/>
  <rect x="116" y="396" width="280" height="10" rx="5" fill="#000000" opacity="0.25"/>
  </g>
</svg>
