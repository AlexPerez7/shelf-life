# Deploy de las Edge Functions de Supabase en cada push a main que las toque
# (o a mano desde Actions → "Deploy de Edge Functions" → Run workflow).
# Necesita dos secrets del repo:
#   SUPABASE_ACCESS_TOKEN: token personal (supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_REF:  id del proyecto (supabase.com/dashboard/project/<id>)
# Sin ellos, el job avisa y termina sin fallar.
name: Deploy de Edge Functions

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Revisar secrets
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::Faltan los secrets SUPABASE_ACCESS_TOKEN y/o SUPABASE_PROJECT_REF: no se publican las funciones."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: latest
      # Las mismas funciones que el README manda a publicar a mano.
      - name: Publicar funciones
        if: steps.check.outputs.ready == 'true'
        run: |
          supabase functions deploy igdb-search steam-library steam-auth game-deals media-search \
            --project-ref "$SUPABASE_PROJECT_REF"
